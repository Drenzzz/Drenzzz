<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">What Drenzzz builds</title>
  <desc id="desc">Three connected lanes for device tooling, API services, and web products.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#16161e"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#292e42"/>
  <text x="54" y="54" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">THE WORKBENCH</text>
  <path d="M54 78H1146" stroke="url(#line)" stroke-width="2"/>
  <g transform="translate(54 108)">
    <rect width="336" height="140" rx="14" fill="#1f2335" stroke="#3b4261"/>
    <circle cx="34" cy="35" r="12" fill="#9ece6a"/>
    <text x="58" y="42" fill="#c0caf5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="700">DEVICE TOOLS</text>
    <text x="28" y="84" fill="#a9b1d6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">ADB, Fastboot, Linux workflows</text>
    <text x="28" y="112" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Wails + React + TypeScript</text>
    <text x="28" y="132" fill="#9ece6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">-> ADBKit</text>
    <rect x="378" width="336" height="140" rx="14" fill="#1f2335" stroke="#3b4261"/>
    <circle cx="412" cy="35" r="12" fill="#7aa2f7"/>
    <text x="436" y="42" fill="#c0caf5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="700">API SERVICES</text>
    <text x="406" y="84" fill="#a9b1d6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Caching, auth, and reliable delivery</text>
    <text x="406" y="112" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Go + Fiber + Redis</text>
    <text x="406" y="132" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">-> Hayainime API</text>
    <rect x="756" width="336" height="140" rx="14" fill="#1f2335" stroke="#3b4261"/>
    <circle cx="790" cy="35" r="12" fill="#bb9af7"/>
    <text x="814" y="42" fill="#c0caf5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="700">WEB PRODUCTS</text>
    <text x="784" y="84" fill="#a9b1d6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Business interfaces that earn their keep</text>
    <text x="784" y="112" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Next.js + PostgreSQL + Docker</text>
    <text x="784" y="132" fill="#bb9af7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">-> Mitra Wiradoor</text>
  </g>
</svg>
